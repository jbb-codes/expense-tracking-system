<section class="create-category-container">
  <h1>Create Category</h1>

  <p>
    Enter the information below to add a new category to your expense tracker.
  </p>

  <form #categoryForm="ngForm" (ngSubmit)="createCategory()">
    <!-- User ID field -->
    <div class="form-group">
      <label for="userId">User ID</label>
      <input
        id="userId"
        name="userId"
        type="number"
        [(ngModel)]="category.userId"
        required
      />
    </div>

    <!-- Category ID field -->
    <div class="form-group">
      <label for="categoryId">Category ID</label>
      <input
        id="categoryId"
        name="categoryId"
        type="number"
        [(ngModel)]="category.categoryId"
        required
      />
    </div>

    <!-- Category name field -->
    <div class="form-group">
      <label for="name">Category Name</label>
      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="category.name"
        required
      />
    </div>

    <!-- Optional category description field -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="category.description"
        rows="4"
      ></textarea>
    </div>

    <!-- Displays validation or API errors. -->
    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <!-- Displays a confirmation after successful creation. -->
    <p class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <button
      type="submit"
      [disabled]="categoryForm.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Creating Category...' : 'Create Category' }}
    </button>
  </form>
</section>
